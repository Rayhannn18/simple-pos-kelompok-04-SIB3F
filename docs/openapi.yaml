openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          required: false
          description: Batas jumlah produk per halaman (maksimal 100)
          schema:
            type: integer
            default: 15
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: Kolom pengurutan (prefix minus untuk urutan menurun, contoh -price)
          schema:
            type: string
            enum: [name, -name, price, -price]
            default: name
        - name: q
          in: query
          required: false
          description: Pencarian nama produk (minimal 2 karakter)
          schema:
            type: string
            minLength: 2
        - name: category_id
          in: query
          required: false
          description: Filter ID kategori
          schema:
            type: integer
      responses:
        '200':
          description: Daftar produk berpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string, nullable: true }
                  links:
                    type: object
                    properties:
                      first: { type: string, nullable: true }
                      last: { type: string, nullable: true }
                      prev: { type: string, nullable: true }
                      next: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      from: { type: integer, nullable: true }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      to: { type: integer, nullable: true }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Parameter query string tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Key unik idempotency untuk mencegah duplikasi transaksi
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '400':
          description: Header Idempotency-Key wajib diisi
        '401':
          description: Token tidak ada atau tidak valid
        '409':
          description: Request dengan key ini masih diproses
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

# Perbandingan Pengalaman Pengujian API: Postman/Insomnia vs cURL
# Menguji ketiga endpoint (/api/login, /api/products, dan /api/transactions) menggunakan GUI klien HTTP seperti Postman/Insomnia jauh lebih praktis dan terstruktur dibandingkan menggunakan perintah cURL di terminal. Pada Postman/Insomnia, pengelolaan header seperti Accept: application/json, Idempotency-Key, serta penyisipan Bearer Token dapat disimpan di dalam tab khusus atau environment variable tanpa harus mengetik ulang flag -H yang panjang dan rawan salah ketik (typo) maupun masalah tanda kutip JSON seperti pada cURL. Selain itu, Postman/Insomnia menampilkan response JSON yang langsung diformat (pretty-printed) dengan pewarnaan sintaks serta memisahkan tab informasi status kode HTTP dan response header (seperti saat mengecek header Idempotent-Replayed: true), sedangkan cURL tetap lebih unggul dan ringan ketika dibutuhkan untuk pengujian cepat langsung dari baris perintah atau otomatisasi skrip di terminal (seperti simulasi loop rate-limiting 429).

